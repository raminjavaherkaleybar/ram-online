name: Generate SEO product pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-product-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate static product pages and sitemap
        run: node scripts/generate-product-pages.mjs
      - name: Commit generated SEO pages
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products sitemap.xml
            git commit -m "Generate SEO pages for catalog products"
            git push origin main
          else
            echo "SEO pages and sitemap are already up to date."
          fi
