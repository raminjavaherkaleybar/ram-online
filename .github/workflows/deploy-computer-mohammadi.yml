name: Deploy Computer Mohammadi Store

on:
  push:
    branches:
      - computer-mohammadi-store
    paths:
      - "computer-mohammadi/**"
      - ".github/workflows/deploy-computer-mohammadi.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: computer-mohammadi-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated store branch
        uses: actions/checkout@v4
        with:
          ref: computer-mohammadi-store

      - name: Validate storefront files
        run: |
          test -s computer-mohammadi/index.html
          test -s computer-mohammadi/admin.html
          grep -q "کامپیوتر محمدی" computer-mohammadi/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload storefront artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: computer-mohammadi

  deploy:
    environment:
      name: computer-mohammadi-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish storefront
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          environment: computer-mohammadi-pages
